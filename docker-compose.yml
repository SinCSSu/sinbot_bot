name: sinbot-bot

services:
  sinbot-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sinbot-bot:latest
    container_name: sinbot-bot
    restart: unless-stopped
    stop_grace_period: 30s

    # Nacos 引导参数由该文件注入（复制 .env.deploy.example 为 .env.deploy 后填写）。
    # 业务配置（OneBot 连接、插件参数等）仍由 Nacos 统一下发，不进镜像。
    env_file:
      - .env.deploy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - snowluma_default

networks:
  snowluma_default:
    external: true