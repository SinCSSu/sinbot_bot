name: Build & Deploy

# 合并（PR merge / squash merge）到 master 后，GitHub 会向 master 产生一次 push 事件，
# 因此监听 push 即可覆盖"merge 时触发"。另外保留手动触发用于回滚/补发。
on:
  push:
    branches:
      - master
    # 仅代码或构建相关文件变化时才重新构建，跳过纯文档提交
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免连续合并时旧镜像覆盖新镜像
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 以下全部来自仓库 Settings → Secrets and variables → Actions
  #   vars.TCR_REGISTRY   例：ccr.ccs.tencentyun.com（个人版）
  #                           或 xxx.tencentcloudcr.com（企业版，带地域域名）
  #   vars.TCR_NAMESPACE  例：sinbot
  #   vars.IMAGE_NAME     例：sinbot
  IMAGE: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/${{ vars.IMAGE_NAME }}

jobs:
  build-push-deploy:
    name: Build → Push TCR → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          set -euo pipefail
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          DATE_TAG="$(date -u +%Y%m%d-%H%M%S)"
          {
            echo "sha=${SHA_SHORT}"
            echo "date=${DATE_TAG}"
            echo "version=${DATE_TAG}-${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 构建上下文为仓库根目录：Dockerfile 会拷贝 SinBot/ 下的依赖清单与代码
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          # 标签写进镜像，便于线上追溯来源 commit
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger deploy webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          IMAGE: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::error::DEPLOY_WEBHOOK_URL 未配置——镜像已推送但不会部署，请补齐 secret"
            exit 1
          fi

          # 认证方式二选一，按接收端实现取用：
          #   X-Deploy-Token: ${WEBHOOK_TOKEN}
          #   Authorization: Bearer ${WEBHOOK_TOKEN}
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --max-time 60 \
            -X POST "${WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${WEBHOOK_TOKEN}" \
            -d "{
                  \"image\": \"${IMAGE}\",
                  \"tag\": \"${{ steps.meta.outputs.version }}\",
                  \"sha\": \"${GITHUB_SHA}\",
                  \"ref\": \"${GITHUB_REF_NAME}\",
                  \"repository\": \"${GITHUB_REPOSITORY}\",
                  \"actor\": \"${GITHUB_ACTOR}\"
                }"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 部署流水线结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 状态 | ${{ job.status }} |"
            echo "| 镜像 | \`${{ env.IMAGE }}:${{ steps.meta.outputs.version }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| 触发者 | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
