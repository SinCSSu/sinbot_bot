name: Build & Publish

# 合并（PR merge / squash merge）到 master 后，GitHub 会向 master 产生一次 push 事件，
# 因此监听 push 即可覆盖"merge 时触发"。另外保留手动触发用于回滚/补发。
on:
  push:
    branches:
      - master
    # 纯文档提交不重新构建镜像
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免连续合并时旧镜像覆盖新镜像
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# 推送到 GHCR 需要 packages:write；GITHUB_TOKEN 由 Actions 自动注入，无需手工配置
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build → Push GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        run: |
          set -euo pipefail
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          DATE_TAG="$(date -u +%Y%m%d-%H%M%S)"
          # GHCR 镜像名必须全小写，而 github.repository 可能含大写（账号或仓库名）
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=${REGISTRY}/${REPO_LC}"
            echo "sha=${SHA_SHORT}"
            echo "version=${DATE_TAG}-${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 构建上下文为仓库根目录：Dockerfile 会拷贝 SinBot/ 下的依赖清单与代码
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          # 标签写进镜像，便于线上追溯来源 commit
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### 镜像构建结果"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 状态 | ${{ job.status }} |"
            echo "| 镜像 | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| 触发者 | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"
