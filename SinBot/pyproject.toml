[project]
name = "SinBot"
version = "0.1.0"
description = "SinBot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[fastapi,websockets]>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-adapter-qq>=1.7.2",
    "nonebot-plugin-orm>=0.8.3",
    "pillow>=10.0.0",
    "datetime>=6.0",
    "require>=0.1.1",
    "openai>=3.6.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.22.1",
    "jionlp>=1.5.29",
    "nb-cli==1.7.4",
    "jmcomic>=2.7.9",
    "img2pdf",
]
[tool.nonebot]
plugin_dirs = ["sinbot/plugins"]
builtin_plugins = ["echo"]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "nonebot_plugin_orm"
]
